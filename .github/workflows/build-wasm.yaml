name: Build and Deploy Wasm
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: 'wasm'
          arch: 'wasm_singlethread'
      - name: Fix Qt tool permissions
        run: chmod +x "${QT_ROOT_DIR}/bin/"*

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.50
          ./emsdk activate 3.1.500
          echo "EMSDK=$PWD" >> $GITHUB_ENV
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH 
          
      - name: Configure and build
        run: |
          mkdir build && cd build
          qt-cmake ..
          cmake --build . --parallel 2

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp build/HelloWasm.html deploy/index.html
          cp build/HelloWasm.js deploy/
          cp build/HelloWasm.wasm deploy/
          cp build/qtloader.js deploy/ 2>/dev/null || true
          cp build/qtlogo.svg deploy/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
