name: Build and Deploy Wasm
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: 'wasm'
          arch: 'wasm_multithread'

      - name: Fix Qt tool permissions
        run: chmod +x "${QT_ROOT_DIR}/bin/"*

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.50
          ./emsdk activate 3.1.50
          echo "EMSDK=$PWD" >> $GITHUB_ENV
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH

      - name: Configure and build
        run: |
          qt-cmake -S UI -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: List build output
        run: find build -maxdepth 2 -type f \( -name "*.html" -o -name "*.js" -o -name "*.wasm" -o -name "*.svg" \)

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp build/logisimp.html deploy/index.html
          cp build/logisimp.js deploy/
          cp build/logisimp.wasm deploy/
          cp build/qtloader.js deploy/ 2>/dev/null || true
          cp build/qtlogo.svg deploy/ 2>/dev/null || true
          printf '/*\n  Cross-Origin-Opener-Policy: same-origin\n  Cross-Origin-Embedder-Policy: require-corp\n' > deploy/_headers

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=deploy --prod --no-build --site ${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
